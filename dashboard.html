<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Painel do Técnico – Ar-Condicionado</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      color: #222;
      min-height: 100vh;
    }

    /* ── CABEÇALHO ── */
    .header {
      background: #1F3864;
      color: white;
      padding: 16px 20px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-icon { font-size: 26px; }
    .header h1 { font-size: 15px; font-weight: 700; line-height: 1.3; }
    .header p  { font-size: 11px; opacity: .75; margin-top: 2px; }
    .btn-refresh {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.3);
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-refresh:active { background: rgba(255,255,255,.25); }

    /* ── ATUALIZADO EM ── */
    .atualizado {
      text-align: center;
      font-size: 11px;
      color: #888;
      padding: 8px 16px 4px;
    }

    /* ── RESUMO RÁPIDO (pills) ── */
    .resumo {
      display: flex;
      gap: 10px;
      padding: 12px 16px 4px;
      overflow-x: auto;
    }
    .resumo-pill {
      flex-shrink: 0;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pill-vencido  { background: #FDECEA; color: #b71c1c; }
    .pill-urgente  { background: #FFF3E0; color: #e65100; }
    .pill-semana   { background: #EFF4FB; color: #1F3864; }

    /* ── SEÇÃO ── */
    .secao {
      margin: 14px 16px 0;
    }
    .secao-titulo {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: #555;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-count {
      background: #1F3864;
      color: white;
      border-radius: 20px;
      padding: 2px 8px;
      font-size: 11px;
    }

    /* ── CARD DE AC ── */
    .ac-card {
      background: white;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,.07);
      border-left: 5px solid #ccc;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .ac-card.vencido  { border-left-color: #e53935; }
    .ac-card.urgente  { border-left-color: #f57c00; }
    .ac-card.atencao  { border-left-color: #fbc02d; }
    .ac-card.ok       { border-left-color: #43a047; }

    .ac-card-topo {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .ac-id {
      font-size: 11px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .ac-local {
      font-size: 16px;
      font-weight: 800;
      color: #1F3864;
      margin-top: 1px;
    }
    .ac-andar {
      font-size: 12px;
      color: #777;
    }
    .status-badge {
      flex-shrink: 0;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }
    .status-badge.vencido { background: #FDECEA; color: #b71c1c; }
    .status-badge.urgente { background: #FFF3E0; color: #e65100; }
    .status-badge.atencao { background: #FFFDE7; color: #f57f17; }
    .status-badge.ok      { background: #E8F5E9; color: #2e7d32; }

    .ac-tarefas {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 2px;
    }
    .tarefa-linha {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }
    .tarefa-tipo { color: #444; display: flex; align-items: center; gap: 5px; }
    .tarefa-data { font-weight: 700; color: #222; }
    .tarefa-dias {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 12px;
      font-weight: 600;
      margin-left: 6px;
    }
    .dias-vencido { background: #FDECEA; color: #b71c1c; }
    .dias-urgente { background: #FFF3E0; color: #e65100; }
    .dias-atencao { background: #FFFDE7; color: #f57f17; }
    .dias-ok      { background: #E8F5E9; color: #2e7d32; }

    /* ── ESTADO VAZIO ── */
    .vazio {
      text-align: center;
      padding: 28px 20px;
      color: #aaa;
      font-size: 14px;
    }
    .vazio-icon { font-size: 40px; margin-bottom: 8px; }

    /* ── LOADING / ERRO ── */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #888;
      font-size: 15px;
    }
    .spinner {
      display: inline-block;
      width: 32px; height: 32px;
      border: 3px solid #d0d8e4;
      border-top-color: #2E75B6;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .erro-box {
      margin: 16px;
      background: #fff3f3;
      border: 1.5px solid #e53935;
      color: #c62828;
      border-radius: 10px;
      padding: 16px;
      font-size: 14px;
      text-align: center;
    }

    /* ── SEPARADOR DE SEMANAS ── */
    .semana-label {
      font-size: 12px;
      font-weight: 700;
      color: #2E75B6;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin: 14px 0 8px;
      padding-left: 4px;
    }

    /* ── RODAPÉ ── */
    .rodape {
      text-align: center;
      font-size: 11px;
      color: #bbb;
      padding: 20px 16px 32px;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-icon">🛠️</div>
    <div>
      <h1>Painel do Técnico</h1>
      <p>Pousada Marie Claire · Ar-Condicionado</p>
    </div>
  </div>
  <button class="btn-refresh" onclick="carregarDados()">
    🔄 Atualizar
  </button>
</div>

<div id="atualizado" class="atualizado"></div>

<!-- Resumo rápido -->
<div class="resumo" id="resumo" style="display:none">
  <div class="resumo-pill pill-vencido" id="pill-vencido">⛔ 0 vencidos</div>
  <div class="resumo-pill pill-urgente" id="pill-urgente">⚠️ 0 urgentes</div>
  <div class="resumo-pill pill-semana"  id="pill-semana">📅 0 esta semana</div>
</div>

<!-- Área de conteúdo -->
<div id="conteudo">
  <div class="loading">
    <div class="spinner"></div>
    <div>Carregando dados…</div>
  </div>
</div>

<div class="rodape">Painel atualizado em tempo real · Registre via QR Code de cada equipamento</div>

<script>
// ─────────────────────────────────────────────────────────────────
// CONFIGURAÇÃO — cole a URL do seu Apps Script aqui
// ─────────────────────────────────────────────────────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwcbDQDbgBSUncvq85RzPtxcWWxHg_BL_a9KvyVDAbKN8T7Ps7JMhCx8n1Mr5WgSgXSCQ/exec';
// ─────────────────────────────────────────────────────────────────

const BASE_QR_URL = 'https://diretoriamc.github.io/controle-ac-pousada/';

// ── Helpers ────────────────────────────────────────────────────────
const hoje = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };

function fmtData(iso) {
  if (!iso) return null;
  const [y, m, d] = iso.split('-');
  return d ? `${d}/${m}/${y}` : iso;
}

function diasParaStatus(dias) {
  if (dias === null) return null;
  if (dias < 0)       return 'vencido';
  if (dias <= 7)      return 'urgente';
  if (dias <= 14)     return 'atencao';
  return 'ok';
}

function statusLabel(s) {
  return { vencido: '⛔ Vencida', urgente: '⚠️ Urgente', atencao: '🟡 Atenção', ok: '✅ OK', sem_data: '— Sem data' }[s] || s;
}

function diasLabel(dias) {
  if (dias === null) return '';
  if (dias < 0)  return `${Math.abs(dias)}d atraso`;
  if (dias === 0) return 'hoje';
  return `em ${dias}d`;
}

// ── Renderizar lista de ACs filtrada ──────────────────────────────
function renderizarCards(acs) {
  if (!acs.length) {
    return `<div class="vazio"><div class="vazio-icon">✅</div>Nenhuma manutenção prevista aqui</div>`;
  }

  return acs.map(ac => {
    const st = ac.status || 'sem_data';

    // Tarefas a mostrar (apenas as que estão dentro do prazo ou vencidas)
    const tarefas = [];

    if (ac.diasInterna !== null && ac.diasInterna <= 14) {
      const ds = diasParaStatus(ac.diasInterna);
      tarefas.push(`
        <div class="tarefa-linha">
          <span class="tarefa-tipo">🚿 Limpeza Interna</span>
          <span>
            <span class="tarefa-data">${fmtData(ac.proxInterna) || '—'}</span>
            <span class="tarefa-dias dias-${ds}">${diasLabel(ac.diasInterna)}</span>
          </span>
        </div>`);
    }

    if (ac.diasExterna !== null && ac.diasExterna <= 14) {
      const ds = diasParaStatus(ac.diasExterna);
      tarefas.push(`
        <div class="tarefa-linha">
          <span class="tarefa-tipo">🧽 Limpeza Externa</span>
          <span>
            <span class="tarefa-data">${fmtData(ac.proxExterna) || '—'}</span>
            <span class="tarefa-dias dias-${ds}">${diasLabel(ac.diasExterna)}</span>
          </span>
        </div>`);
    }

    // Se não tem nenhuma tarefa pendente, mostrar resumo geral
    if (!tarefas.length) {
      if (ac.proxInterna) tarefas.push(`<div class="tarefa-linha"><span class="tarefa-tipo">🚿 Próx. Interna</span><span class="tarefa-data">${fmtData(ac.proxInterna)}</span></div>`);
      if (ac.proxExterna) tarefas.push(`<div class="tarefa-linha"><span class="tarefa-tipo">🧽 Próx. Externa</span><span class="tarefa-data">${fmtData(ac.proxExterna)}</span></div>`);
      if (!tarefas.length) tarefas.push(`<div class="tarefa-linha" style="color:#aaa;font-size:12px;">Sem datas registradas — use o QR Code após a primeira manutenção</div>`);
    }

    return `
      <div class="ac-card ${st}">
        <div class="ac-card-topo">
          <div>
            <div class="ac-id">${ac.id}</div>
            <div class="ac-local">${ac.local}</div>
            <div class="ac-andar">📍 ${ac.andar}</div>
          </div>
          <span class="status-badge ${st}">${statusLabel(st)}</span>
        </div>
        <div class="ac-tarefas">${tarefas.join('')}</div>
      </div>`;
  }).join('');
}

// ── Renderizar seção com título ───────────────────────────────────
function secao(titulo, badgeNum, cor, conteudo) {
  return `
    <div class="secao">
      <div class="secao-titulo" style="color:${cor}">
        ${titulo}
        <span class="badge-count" style="background:${cor}">${badgeNum}</span>
      </div>
      ${conteudo}
    </div>`;
}

// ── Carregar dados do Apps Script ─────────────────────────────────
function carregarDados() {
  document.getElementById('resumo').style.display = 'none';
  document.getElementById('atualizado').textContent = '';
  document.getElementById('conteudo').innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div>Carregando dados…</div>
    </div>`;

  fetch(SCRIPT_URL + '?acao=dashboard')
    .then(r => r.json())
    .then(resp => {
      if (resp.status !== 'ok') throw new Error(resp.msg || 'Erro ao carregar dados');
      renderizar(resp);
    })
    .catch(err => {
      console.error(err);
      document.getElementById('conteudo').innerHTML = `
        <div class="erro-box">
          ⚠️ Não foi possível carregar os dados.<br>
          <small style="opacity:.7">${err.message}</small><br><br>
          <strong>Verifique se o Apps Script foi reimplantado com o novo código.</strong>
        </div>`;
    });
}

// ── Renderizar toda a tela com os dados ──────────────────────────
function renderizar(resp) {
  const acs = resp.acs || [];
  const agora = hoje();
  const fimSemana1 = new Date(agora); fimSemana1.setDate(agora.getDate() + 7);
  const fimSemana2 = new Date(agora); fimSemana2.setDate(agora.getDate() + 14);

  // Separar grupos
  const vencidos  = acs.filter(a => a.status === 'vencido');
  const urgentes  = acs.filter(a => a.status === 'urgente');

  // Esta semana e próxima semana: ACs com algo vencendo nos próximos 14 dias
  // (já inclui urgentes, que são 0-7 dias — mas mostramos separado)
  // Aqui: "esta semana" = 0-7 dias, "próxima semana" = 8-14 dias
  const estaSemana = acs.filter(a => {
    const d = Math.min(
      a.diasInterna !== null ? a.diasInterna : 999,
      a.diasExterna !== null ? a.diasExterna : 999
    );
    return d >= 0 && d <= 7;
  });

  const proxSemana = acs.filter(a => {
    const d = Math.min(
      a.diasInterna !== null ? a.diasInterna : 999,
      a.diasExterna !== null ? a.diasExterna : 999
    );
    return d >= 8 && d <= 14;
  });

  // Atualizar pills
  document.getElementById('pill-vencido').textContent = `⛔ ${vencidos.length} vencido${vencidos.length !== 1 ? 's' : ''}`;
  document.getElementById('pill-urgente').textContent = `⚠️ ${estaSemana.length} esta semana`;
  document.getElementById('pill-semana').textContent  = `📅 ${proxSemana.length} próx. semana`;
  document.getElementById('resumo').style.display = 'flex';

  // Atualizado em
  document.getElementById('atualizado').textContent = `Atualizado: ${resp.geradoEm || '—'}`;

  // Montar HTML
  let html = '';

  if (vencidos.length) {
    html += secao('🔴 Vencidos — fazer agora', vencidos.length, '#b71c1c', renderizarCards(vencidos));
  }

  if (estaSemana.length) {
    html += secao('🟠 Esta semana (próximos 7 dias)', estaSemana.length, '#e65100', renderizarCards(estaSemana));
  }

  if (proxSemana.length) {
    html += secao('🟡 Próxima semana (8–14 dias)', proxSemana.length, '#f57f17', renderizarCards(proxSemana));
  }

  if (!vencidos.length && !estaSemana.length && !proxSemana.length) {
    html = `<div class="vazio" style="margin-top:40px">
      <div class="vazio-icon">✅</div>
      <strong>Tudo em dia!</strong><br>
      Nenhuma manutenção prevista para os próximos 14 dias.
    </div>`;
  }

  html += '<div style="height:16px"></div>';

  document.getElementById('conteudo').innerHTML = html;
}

// ── Auto-atualizar a cada 5 minutos ──────────────────────────────
carregarDados();
setInterval(carregarDados, 5 * 60 * 1000);
</script>
</body>
</html>
