<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Registro de Manutencao - Ar-Condicionado</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #222; min-height: 100vh; }
    .header { background: #1F3864; color: white; padding: 16px 20px 14px; display: flex; align-items: center; gap: 12px; }
    .header-icon { font-size: 28px; }
    .header h1 { font-size: 16px; font-weight: 700; line-height: 1.3; }
    .header p  { font-size: 12px; opacity: .75; margin-top: 2px; }
    .equip-card { background: white; margin: 16px; border-radius: 12px; padding: 16px; border-left: 5px solid #2E75B6; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .equip-card h2 { font-size: 20px; color: #1F3864; font-weight: 800; }
    .equip-card .local { font-size: 15px; color: #555; margin-top: 2px; }
    .equip-info { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .badge { background: #EFF4FB; color: #1F3864; font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
    .form-section { background: white; margin: 0 16px 16px; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .form-section h3 { font-size: 14px; font-weight: 700; color: #1F3864; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 2px solid #EFF4FB; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
    .field label .req { color: #e53935; margin-left: 2px; }
    .field input, .field select, .field textarea { width: 100%; padding: 12px 14px; border: 1.5px solid #d0d8e4; border-radius: 8px; font-size: 15px; color: #222; background: #fff; -webkit-appearance: none; appearance: none; transition: border-color .2s; }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: #2E75B6; box-shadow: 0 0 0 3px rgba(46,117,182,.12); }
    .field textarea { resize: vertical; min-height: 80px; }
    .field input[type="date"] { color: #222; }
    .btn-submit { display: block; width: calc(100% - 32px); margin: 0 16px 32px; padding: 16px; background: #1F3864; color: white; border: none; border-radius: 12px; font-size: 17px; font-weight: 700; cursor: pointer; letter-spacing: .3px; transition: background .2s, transform .1s; }
    .btn-submit:active { transform: scale(.98); background: #16284a; }
    .btn-submit:disabled { background: #90a4c8; cursor: default; }
    #tela-sucesso { display: none; text-align: center; padding: 60px 32px; }
    .sucesso-icon { font-size: 72px; margin-bottom: 16px; }
    .sucesso-titulo { font-size: 22px; font-weight: 800; color: #1F3864; margin-bottom: 8px; }
    .sucesso-msg { font-size: 15px; color: #555; line-height: 1.5; }
    .btn-nova { margin-top: 28px; display: inline-block; background: #2E75B6; color: white; padding: 14px 28px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; border: none; }
    .msg-erro { display: none; background: #fff3f3; border: 1.5px solid #e53935; color: #c62828; border-radius: 8px; padding: 12px 14px; font-size: 14px; margin: 0 16px 16px; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.4); border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .data-limite-box { background: #EFF4FB; border: 1.5px solid #2E75B6; border-radius: 8px; padding: 12px 14px; font-size: 16px; font-weight: 700; color: #1F3864; }
    .data-limite-box.vencida { background: #fff3f3; border-color: #e53935; color: #c62828; }
    .data-limite-box.urgente { background: #fff8e1; border-color: #f57c00; color: #e65100; }
    .opcoes-manutencao { display: flex; flex-direction: column; gap: 12px; }
    .opcao-card { display: flex; align-items: center; gap: 16px; padding: 16px 18px; border: 2px solid #d0d8e4; border-radius: 12px; cursor: pointer; transition: border-color .2s, background .2s, box-shadow .2s; position: relative; }
    .opcao-card input[type="radio"] { width: 22px; height: 22px; accent-color: #1F3864; cursor: pointer; flex-shrink: 0; }
    .opcao-card .opcao-texto { flex: 1; }
    .opcao-card .opcao-titulo { font-size: 16px; font-weight: 700; color: #1F3864; display: block; }
    .opcao-card .opcao-desc { font-size: 13px; color: #666; margin-top: 2px; display: block; }
    .opcao-card:has(input:checked) { border-color: #1F3864; background: #EFF4FB; box-shadow: 0 0 0 3px rgba(31,56,100,.08); }
    .opcao-card .opcao-icone { font-size: 28px; flex-shrink: 0; }
  </style>
</head>
<body>
<div class="header">
  <div class="header-icon">❄️</div>
  <div>
    <h1>Registro de Manutencao</h1>
    <p>Pousada Marie Claire</p>
  </div>
</div>
<div id="tela-form">
  <div class="equip-card">
    <h2 id="equip-id">Carregando…</h2>
    <div class="local" id="equip-local"></div>
    <div class="equip-info" id="equip-badges"></div>
  </div>
  <div class="msg-erro" id="msg-erro"></div>
  <form id="form-limpeza" novalidate>
    <div class="form-section">
      <h3>📊 Situacao Atual</h3>
      <div class="field">
        <label>📅 Proxima Limpeza Interna</label>
        <div id="data-limite-box" class="data-limite-box">—</div>
      </div>
      <div class="field">
        <label>🧹 Proxima Limpeza Externa</label>
        <div id="data-filtro-box" class="data-limite-box">—</div>
      </div>
    </div>
    <div class="form-section">
      <h3>🔧 Que manutencao foi realizada?</h3>
      <div class="field">
        <div class="opcoes-manutencao">
          <label class="opcao-card" id="opt-interna">
            <input type="radio" name="tipo_limpeza" value="Limpeza Interna" id="radio-interna" onchange="onTipoChange()">
            <span class="opcao-icone">🚿</span>
            <span class="opcao-texto">
              <span class="opcao-titulo">Limpeza Interna</span>
              <span class="opcao-desc">Limpeza completa do equipamento · atualiza prazo de 6 meses</span>
            </span>
          </label>
          <label class="opcao-card" id="opt-externa">
            <input type="radio" name="tipo_limpeza" value="Limpeza Externa" id="radio-externa" onchange="onTipoChange()">
            <span class="opcao-icone">🧽</span>
            <span class="opcao-texto">
              <span class="opcao-titulo">Limpeza Externa</span>
              <span class="opcao-desc">Limpeza do filtro / parte externa · atualiza prazo de 14 dias</span>
            </span>
          </label>
          <label class="opcao-card" id="opt-outra">
            <input type="radio" name="tipo_limpeza" value="Outra" id="radio-outra" onchange="onTipoChange()">
            <span class="opcao-icone">🛠️</span>
            <span class="opcao-texto">
              <span class="opcao-titulo">Outra manutencao</span>
              <span class="opcao-desc">Corretiva, reparo, recarga de gas etc. · registra no historico</span>
            </span>
          </label>
        </div>
      </div>
      <div id="campos-outra" style="display:none">
        <div class="field">
          <label>O que foi feito?<span class="req">*</span></label>
          <input type="text" id="descricao_outra" name="descricao_outra" placeholder="Ex: Recarga de gas, reparo no compressor…">
        </div>
      </div>
      <div id="campos-limpeza" style="display:none">
        <div class="field">
          <label>Observacoes da limpeza</label>
          <textarea id="descricao_limpeza" name="descricao_limpeza" placeholder="Descreva o que foi feito, condicoes encontradas…"></textarea>
        </div>
      </div>
      <div id="campos-comuns" style="display:none">
        <div class="field">
          <label>Pecas trocadas</label>
          <input type="text" id="pecas" name="pecas" placeholder="Ex: Filtro de ar, capacitor… ou deixe em branco">
        </div>
        <div class="field">
          <label>Observacoes adicionais</label>
          <textarea id="observacoes" name="observacoes" placeholder="Algo importante a registrar…"></textarea>
        </div>
      </div>
    </div>
  </form>
  <button class="btn-submit" id="btn-enviar" onclick="enviarFormulario()">
    ✅ Registrar Manutencao
  </button>
</div>
<div id="tela-sucesso">
  <div class="sucesso-icon">✅</div>
  <div class="sucesso-titulo" id="sucesso-titulo">Manutencao registrada!</div>
  <div class="sucesso-msg" id="sucesso-detalhe"></div>
  <button class="btn-nova" onclick="location.reload()">Registrar outra manutencao</button>
</div>

const hoje = new Date();
hoje.setHours(0,0,0,0);
function isoParaDate(iso){const[y,m,d]=iso.split('-');return new Date(+y,+m-1,+d);}
function dateParaIso(d){return d.toISOString().split('T')[0];}
function fmt(iso){const[y,m,d]=iso.split('-');return d+'/'+m+'/'+y;}
const params=new URLSearchParams(window.location.search);
const equipId=(params.get('id')||'').toUpperCase();
const equip=EQUIPAMENTOS[equipId];
const ultimaParam=params.get('ultima');
const filtroParam=params.get('filtro');
const ultimaData=ultimaParam?isoParaDate(ultimaParam):(()=>{const d=new Date(hoje);d.setMonth(d.getMonth()-6);return d;})();
const filtroData=filtroParam?isoParaDate(filtroParam):(()=>{const d=new Date(hoje);d.setDate(d.getDate()-14);return d;})();
const proximaInterna=new Date(ultimaData);proximaInterna.setMonth(proximaInterna.getMonth()+6);
const proximaInternaIso=dateParaIso(proximaInterna);
const proximaExterna=new Date(filtroData);proximaExterna.setDate(proximaExterna.getDate()+14);
const proximaExternaIso=dateParaIso(proximaExterna);
const novaProximaInterna=new Date(hoje);novaProximaInterna.setMonth(novaProximaInterna.getMonth()+6);
const novaProximaInternaIso=dateParaIso(novaProximaInterna);
const novaProximaExterna=new Date(hoje);novaProximaExterna.setDate(novaProximaExterna.getDate()+14);
const novaProximaExternaIso=dateParaIso(novaProximaExterna);
const dataHoje=dateParaIso(hoje);
if(equip){
  document.getElementById('equip-id').textContent=equipId;
  document.getElementById('equip-local').textContent=equip.local+' · '+equip.tipo;
  document.getElementById('equip-badges').innerHTML='<span class="badge">🏷️ '+equip.marca+'</span><span class="badge">📐 '+equip.modelo+'</span><span class="badge">❄️ '+equip.btus.toLocaleString('pt-BR')+' BTUs</span>';
}else{
  document.getElementById('equip-id').textContent='Equipamento nao identificado';
  document.getElementById('equip-local').textContent='Verifique se o QR Code esta correto.';
}
function exibirBoxData(elId,dataAlvo,limiteUrgente){
  const box=document.getElementById(elId);
  const iso=dateParaIso(dataAlvo);
  const dias=Math.round((dataAlvo-hoje)/86400000);
  let label='';
  if(dias<0){box.classList.add('vencida');label=' · ⛔ VENCIDA ha '+Math.abs(dias)+' dia(s)';}
  else if(dias<=limiteUrgente){box.classList.add('urgente');label=' · ⚠️ '+dias+' dia(s) restante(s)';}
  else{label=' · ✅ '+dias+' dia(s) restante(s)';}
  box.textContent=fmt(iso)+label;
}
exibirBoxData('data-limite-box',proximaInterna,30);
exibirBoxData('data-filtro-box',proximaExterna,3);
function onTipoChange(){
  const tipo=document.querySelector('input[name="tipo_limpeza"]:checked')?.value;
  document.getElementById('campos-outra').style.display=tipo==='Outra'?'block':'none';
  document.getElementById('campos-limpeza').style.display=(tipo==='Limpeza Interna'||tipo==='Limpeza Externa')?'block':'none';
  document.getElementById('campos-comuns').style.display=tipo?'block':'none';
}
function enviarFormulario(){
  const msgErro=document.getElementById('msg-erro');
  msgErro.style.display='none';
  const tipo=document.querySelector('input[name="tipo_limpeza"]:checked')?.value;
  if(!tipo){msgErro.textContent='⚠️ Selecione que tipo de manutencao foi realizada.';msgErro.style.display='block';document.getElementById('opt-interna').scrollIntoView({behavior:'smooth',block:'center'});return;}
  if(tipo==='Outra'){
    const el=document.getElementById('descricao_outra');
    if(!el.value.trim()){el.style.borderColor='#e53935';el.scrollIntoView({behavior:'smooth',block:'center'});el.focus();return;}
    el.style.borderColor='';
  }
  const btn=document.getElementById('btn-enviar');
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Enviando…';
  let dataLimpezaInterna='—',novaProxInternaEnvio=proximaInternaIso,dataLimpezaExterna='—',novaProxExternaEnvio=proximaExternaIso;
  if(tipo==='Limpeza Interna'){dataLimpezaInterna=dataHoje;novaProxInternaEnvio=novaProximaInternaIso;}
  else if(tipo==='Limpeza Externa'){dataLimpezaExterna=dataHoje;novaProxExternaEnvio=novaProximaExternaIso;}
  const descricaoFinal=tipo==='Outra'?(document.getElementById('descricao_outra')?.value.trim()||'—'):(document.getElementById('descricao_limpeza')?.value.trim()||'—');
  const payload={equipamento_id:equipId,local:equip?equip.local:'—',tipo_limpeza:tipo,data_limpeza_interna:dataLimpezaInterna,proxima_limpeza_interna:novaProxInternaEnvio,data_limpeza_externa:dataLimpezaExterna,proxima_limpeza_externa:novaProxExternaEnvio,descricao:descricaoFinal,pecas:document.getElementById('pecas')?.value.trim()||'—',observacoes:document.getElementById('observacoes')?.value.trim()||'—',email_notificacao:EMAIL_NOTIFICACAO};
  fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)})
  .then(r=>r.json()).then(resp=>{if(resp.status==='ok'){mostrarSucesso(payload);}else{throw new Error(resp.msg||'Erro desconhecido');}})
  .catch(err=>{console.error(err);msgErro.textContent='⚠️ Erro ao enviar. Verifique sua conexao e tente novamente.';msgErro.style.display='block';btn.disabled=false;btn.innerHTML='✅ Registrar Manutencao';});
}
function mostrarSucesso(p){
  document.getElementById('tela-form').style.display='none';
  const tela=document.getElementById('tela-sucesso');tela.style.display='block';
  let titulo='Manutencao registrada!';
  let detalhe='<strong>'+equipId+' · '+p.local+'</strong><br><br>';
  if(p.tipo_limpeza==='Limpeza Interna'){titulo='Limpeza Interna registrada!';detalhe+='🔧 Limpeza Interna realizada em '+fmt(dataHoje)+'<br>📅 Proxima Limpeza Interna: <strong>'+fmt(p.proxima_limpeza_interna)+'</strong><br><br>Um e-mail de confirmacao foi enviado para a pousada.';}
  else if(p.tipo_limpeza==='Limpeza Externa'){titulo='Limpeza Externa registrada!';detalhe+='🧹 Limpeza Externa realizada em '+fmt(dataHoje)+'<br>🧹 Proxima Limpeza Externa: <strong>'+fmt(p.proxima_limpeza_externa)+'</strong><br><br>Um e-mail de confirmacao foi enviado para a pousada.';}
  else{titulo='Manutencao registrada!';detalhe+='🛠️ '+p.descricao+'<br><br>Registrado no historico. Um e-mail de confirmacao foi enviado.';}
  document.getElementById('sucesso-titulo').textContent=titulo;
  document.getElementById('sucesso-detalhe').innerHTML=detalhe;
}
</script>
</body>
</html>
