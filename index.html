<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Registro de Manutenção – Ar-Condicionado</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      color: #222;
      min-height: 100vh;
    }
    .header {
      background: #1F3864;
      color: white;
      padding: 16px 20px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-icon { font-size: 28px; }
    .header h1 { font-size: 16px; font-weight: 700; line-height: 1.3; }
    .header p  { font-size: 12px; opacity: .75; margin-top: 2px; }
    .equip-card {
      background: white;
      margin: 16px;
      border-radius: 12px;
      padding: 16px;
      border-left: 5px solid #2E75B6;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    .equip-card h2 { font-size: 20px; color: #1F3864; font-weight: 800; }
    .equip-card .local { font-size: 15px; color: #555; margin-top: 2px; }
    .equip-info { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .badge {
      background: #EFF4FB; color: #1F3864; font-size: 12px;
      padding: 4px 10px; border-radius: 20px; font-weight: 600;
    }
    .form-section {
      background: white; margin: 0 16px 16px;
      border-radius: 12px; padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    .form-section h3 {
      font-size: 14px; font-weight: 700; color: #1F3864;
      text-transform: uppercase; letter-spacing: .5px;
      margin-bottom: 14px; padding-bottom: 8px;
      border-bottom: 2px solid #EFF4FB;
    }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid #d0d8e4; border-radius: 8px;
      font-size: 15px; color: #222; background: #fff;
      -webkit-appearance: none; appearance: none; transition: border-color .2s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; border-color: #2E75B6;
      box-shadow: 0 0 0 3px rgba(46,117,182,.12);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .btn-submit {
      display: block; width: calc(100% - 32px);
      margin: 0 16px 32px; padding: 16px;
      background: #1F3864; color: white; border: none;
      border-radius: 12px; font-size: 17px; font-weight: 700;
      cursor: pointer; letter-spacing: .3px;
      transition: background .2s, transform .1s;
    }
    .btn-submit:active { transform: scale(.98); background: #16284a; }
    .btn-submit:disabled { background: #90a4c8; cursor: default; }
    #tela-sucesso { display: none; text-align: center; padding: 60px 32px; }
    .sucesso-icon { font-size: 72px; margin-bottom: 16px; }
    .sucesso-titulo { font-size: 22px; font-weight: 800; color: #1F3864; margin-bottom: 8px; }
    .sucesso-msg { font-size: 15px; color: #555; line-height: 1.5; }
    .btn-nova {
      margin-top: 28px; display: inline-block; background: #2E75B6;
      color: white; padding: 14px 28px; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer; border: none;
    }
    .msg-erro {
      display: none; background: #fff3f3;
      border: 1.5px solid #e53935; color: #c62828;
      border-radius: 8px; padding: 12px 14px;
      font-size: 14px; margin: 0 16px 16px;
    }
    .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,.4); border-top-color: white;
      border-radius: 50%; animation: spin .7s linear infinite;
      margin-right: 8px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .data-limite-box {
      background: #EFF4FB; border: 1.5px solid #2E75B6;
      border-radius: 8px; padding: 12px 14px;
      font-size: 16px; font-weight: 700; color: #1F3864;
    }
    .data-limite-box.sem-registro { background: #f5f5f5; border-color: #bbb; color: #888; font-weight: 400; }
    .data-limite-box.vencida { background: #fff3f3; border-color: #e53935; color: #c62828; }
    .data-limite-box.urgente { background: #fff8e1; border-color: #f57c00; color: #e65100; }
    .opcoes-manutencao { display: flex; flex-direction: column; gap: 12px; }
    .opcao-card {
      display: flex; align-items: center; gap: 16px;
      padding: 16px 18px; border: 2px solid #d0d8e4;
      border-radius: 12px; cursor: pointer;
      transition: border-color .2s, background .2s, box-shadow .2s;
      position: relative;
    }
    .opcao-card input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
    .opcao-check {
      width: 24px; height: 24px; border: 2px solid #b0bec5;
      border-radius: 50%; flex-shrink: 0; display: flex;
      align-items: center; justify-content: center;
      transition: border-color .2s, background .2s; background: white;
    }
    .opcao-check::after {
      content: ''; width: 12px; height: 12px;
      border-radius: 50%; background: white; display: none;
    }
    .opcao-card:has(input:checked) .opcao-check { border-color: #1F3864; background: #1F3864; }
    .opcao-card:has(input:checked) .opcao-check::after { display: block; }
    .opcao-card:has(input:checked) {
      border-color: #1F3864; background: #EFF4FB;
      box-shadow: 0 0 0 3px rgba(31,56,100,.08);
    }
    .opcao-card .opcao-texto { flex: 1; }
    .opcao-card .opcao-titulo { font-size: 16px; font-weight: 700; color: #1F3864; display: block; }
    .opcao-card .opcao-desc { font-size: 13px; color: #666; margin-top: 2px; display: block; }
    .opcao-card .opcao-icone { font-size: 28px; flex-shrink: 0; }
    .carregando {
      text-align: center; padding: 40px 20px;
      color: #555; font-size: 15px;
    }
  </style>
</head>
<body>
<div class="header">
  <div class="header-icon">❄️</div>
  <div style="flex:1">
    <h1>Registro de Manutenção</h1>
    <p>Pousada Marie Claire</p>
  </div>
  <a href="https://diretoriamc.github.io/controle-ac-pousada/dashboard.html"
     style="color:white;font-size:13px;font-weight:600;text-decoration:none;
            background:rgba(255,255,255,0.15);padding:7px 13px;border-radius:8px;
            white-space:nowrap;">
    ← Painel
  </a>
</div>

<div id="tela-carregando" class="carregando">
  <div style="font-size:40px;margin-bottom:12px">⏳</div>
  Carregando dados do equipamento…
</div>

<div id="tela-form" style="display:none">
  <div class="equip-card">
    <h2 id="equip-id">—</h2>
    <div class="local" id="equip-local"></div>
    <div class="equip-info" id="equip-badges"></div>
  </div>
  <div class="msg-erro" id="msg-erro"></div>
  <form id="form-limpeza" novalidate>
    <div class="form-section">
      <h3>📊 Situação Atual</h3>
      <div class="field">
        <label>📅 Próxima Limpeza Interna</label>
        <div id="data-limite-box" class="data-limite-box">—</div>
      </div>
      <div class="field">
        <label>🧹 Próxima Limpeza Externa e Checagem do Gás</label>
        <div id="data-filtro-box" class="data-limite-box">—</div>
      </div>
    </div>
    <div class="form-section">
      <h3>🔧 Que manutenção foi realizada?</h3>
      <div class="field">
        <div class="opcoes-manutencao">
          <label class="opcao-card" id="opt-interna">
            <input type="radio" name="tipo_limpeza" value="Limpeza Interna" id="radio-interna" onchange="onTipoChange()">
            <span class="opcao-check"></span>
            <span class="opcao-icone">🚿</span>
            <span class="opcao-texto">
              <span class="opcao-titulo">Limpeza Interna</span>
              <span class="opcao-desc">Limpeza completa do equipamento · próxima em 6 meses</span>
            </span>
          </label>
          <label class="opcao-card" id="opt-externa">
            <input type="radio" name="tipo_limpeza" value="Limpeza Externa e Checagem do Gás" id="radio-externa" onchange="onTipoChange()">
            <span class="opcao-check"></span>
            <span class="opcao-icone">🧽</span>
            <span class="opcao-texto">
              <span class="opcao-titulo">Limpeza Externa e Checagem do Gás</span>
              <span class="opcao-desc">Limpeza do filtro, carenagem, dreno e parte externa · próxima em 28 dias</span>
            </span>
          </label>
          <label class="opcao-card" id="opt-outra">
            <input type="radio" name="tipo_limpeza" value="Outra" id="radio-outra" onchange="onTipoChange()">
            <span class="opcao-check"></span>
            <span class="opcao-icone">🛠️</span>
            <span class="opcao-texto">
              <span class="opcao-titulo">Outra manutenção</span>
              <span class="opcao-desc">Corretiva, reparo, recarga de gás etc.</span>
            </span>
          </label>
        </div>
      </div>
      <div id="campos-descricao" style="display:none">
        <div class="field">
          <label id="label-descricao">O que foi feito?</label>
          <textarea id="descricao_limpeza" name="descricao_limpeza" placeholder="Descreva o que foi feito…"></textarea>
        </div>
      </div>
      <div id="campos-comuns" style="display:none">
        <div class="field">
          <label>Peças trocadas</label>
          <input type="text" id="pecas" name="pecas" placeholder="Ex: Filtro de ar, capacitor… ou deixe em branco">
        </div>
        <div class="field">
          <label>Observações adicionais</label>
          <textarea id="observacoes" name="observacoes" placeholder="Algo importante a registrar…"></textarea>
        </div>
      </div>
    </div>
  </form>
  <button class="btn-submit" id="btn-enviar" onclick="enviarFormulario()">
    ✅ Registrar Manutenção
  </button>
</div>

<div id="tela-sucesso" style="display:none">
  <div class="sucesso-icon">✅</div>
  <div class="sucesso-titulo" id="sucesso-titulo">Manutenção registrada!</div>
  <div class="sucesso-msg" id="sucesso-detalhe"></div>
  <button class="btn-nova" onclick="location.reload()">Registrar outra manutenção</button>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwcbDQDbgBSUncvq85RzPtxcWWxHg_BL_a9KvyVDAbKN8T7Ps7JMhCx8n1Mr5WgSgXSCQ/exec';

const params  = new URLSearchParams(window.location.search);
const equipId = (params.get('id') || '').toUpperCase();

const hoje = new Date();
hoje.setHours(0, 0, 0, 0);

// Converte dd/MM/yyyy → Date
function brParaDate(br) {
  if (!br || br.trim() === '' || br === '—') return null;
  var p = br.split('/');
  if (p.length === 3) return new Date(parseInt(p[2]), parseInt(p[1]) - 1, parseInt(p[0]));
  return null;
}

// Converte Date → ISO yyyy-mm-dd
function dateParaIso(d) {
  if (!d) return '';
  var mm = ('0' + (d.getMonth() + 1)).slice(-2);
  var dd = ('0' + d.getDate()).slice(-2);
  return d.getFullYear() + '-' + mm + '-' + dd;
}

// Converte ISO yyyy-mm-dd → dd/MM/yyyy
function isoParaBr(iso) {
  if (!iso || iso === '—') return '';
  var p = iso.split('-');
  if (p.length === 3) return p[2] + '/' + p[1] + '/' + p[0];
  return iso;
}

// Converte Date → dd/MM/yyyy
function dateToBr(d) {
  if (!d) return '';
  return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear();
}

// Busca dados do equipamento direto da planilha (inclui datas)
fetch(SCRIPT_URL + '?id=' + equipId)
  .then(function(r) { return r.json(); })
  .then(function(resp) {
    document.getElementById('tela-carregando').style.display = 'none';
    if (resp.status !== 'ok' || !resp.equipamento) {
      document.getElementById('equip-id').textContent = 'Equipamento não encontrado';
      document.getElementById('equip-local').textContent = 'Verifique se o QR Code está correto.';
      document.getElementById('tela-form').style.display = 'block';
      return;
    }
    inicializarFormulario(resp.equipamento);
  })
  .catch(function(err) {
    document.getElementById('tela-carregando').style.display = 'none';
    document.getElementById('equip-id').textContent = 'Erro ao carregar';
    document.getElementById('equip-local').textContent = 'Verifique sua conexão e recarregue a página.';
    document.getElementById('tela-form').style.display = 'block';
  });

function inicializarFormulario(equip) {
  // Preencher cabeçalho
  document.getElementById('equip-id').textContent    = equip.id;
  document.getElementById('equip-local').textContent = equip.local;
  document.getElementById('equip-badges').innerHTML  =
    '<span class="badge">🏨 ' + (equip.andar || '') + '</span>' +
    '<span class="badge">❄️ Ar-Condicionado Split</span>';

  // Datas reais da planilha (formato dd/MM/yyyy ou vazio)
  var proxInternaStr = equip.proxInterna || '';
  var proxExternaStr = equip.proxExterna || '';

  var dProxInterna = brParaDate(proxInternaStr);
  var dProxExterna = brParaDate(proxExternaStr);

  // Exibir situação atual com datas reais
  function exibirBox(elId, dataAlvo, limiteUrgente) {
    var box = document.getElementById(elId);
    if (!dataAlvo) {
      box.textContent = 'Sem registro';
      box.className = 'data-limite-box sem-registro';
      return;
    }
    var dias = Math.round((dataAlvo - hoje) / 86400000);
    var label;
    if (dias < 0) {
      label = ' · ⛔ VENCIDA há ' + Math.abs(dias) + ' dia(s)';
      box.className = 'data-limite-box vencida';
    } else if (dias <= limiteUrgente) {
      label = ' · ⚠️ ' + dias + ' dia(s) restante(s)';
      box.className = 'data-limite-box urgente';
    } else {
      label = ' · ✅ ' + dias + ' dia(s) restante(s)';
      box.className = 'data-limite-box';
    }
    box.textContent = dateToBr(dataAlvo) + label;
  }

  exibirBox('data-limite-box', dProxInterna, 30);
  exibirBox('data-filtro-box', dProxExterna, 3);

  // Calcular novas próximas datas após manutenção feita hoje
  var novaProxInterna = new Date(hoje);
  novaProxInterna.setMonth(novaProxInterna.getMonth() + 6);
  var novaProxInternaIso = dateParaIso(novaProxInterna);

  var novaProxExterna = new Date(hoje);
  novaProxExterna.setDate(novaProxExterna.getDate() + 28);
  var novaProxExternaIso = dateParaIso(novaProxExterna);

  var dataHojeIso = dateParaIso(hoje);

  document.getElementById('tela-form').style.display = 'block';

  window.onTipoChange = function() {
    var tipo = (document.querySelector('input[name="tipo_limpeza"]:checked') || {}).value;
    document.getElementById('campos-descricao').style.display = tipo ? 'block' : 'none';
    document.getElementById('campos-comuns').style.display    = tipo ? 'block' : 'none';
    var label    = document.getElementById('label-descricao');
    var textarea = document.getElementById('descricao_limpeza');
    if (tipo === 'Limpeza Interna') {
      label.textContent = 'Observações da limpeza interna';
      textarea.placeholder = 'Descreva o que foi feito, condições encontradas…';
    } else if (tipo === 'Limpeza Externa e Checagem do Gás') {
      label.textContent = 'Observações da limpeza externa e checagem do gás';
      textarea.placeholder = 'Descreva o que foi feito, condições encontradas…';
    } else {
      label.textContent = 'O que foi feito? *';
      textarea.placeholder = 'Ex: Recarga de gás, reparo no compressor…';
    }
  };

  window.enviarFormulario = function() {
    var msgErro = document.getElementById('msg-erro');
    msgErro.style.display = 'none';
    var tipo = (document.querySelector('input[name="tipo_limpeza"]:checked') || {}).value;
    if (!tipo) {
      msgErro.textContent = '⚠️ Selecione que tipo de manutenção foi realizada.';
      msgErro.style.display = 'block';
      document.getElementById('opt-interna').scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    if (tipo === 'Outra') {
      var el = document.getElementById('descricao_limpeza');
      if (!el.value.trim()) {
        el.style.borderColor = '#e53935';
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.focus();
        return;
      }
      el.style.borderColor = '';
    }
    var btn = document.getElementById('btn-enviar');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Enviando…';

    // Definir datas a enviar conforme tipo
    var dataLimpezaInterna = '—', proxInternaEnvio = proxInternaStr ? dateParaIso(dProxInterna) : '—';
    var dataLimpezaExterna = '—', proxExternaEnvio = proxExternaStr ? dateParaIso(dProxExterna) : '—';

    if (tipo === 'Limpeza Interna') {
      dataLimpezaInterna = dataHojeIso;
      proxInternaEnvio   = novaProxInternaIso;
    } else if (tipo === 'Limpeza Externa') {
      dataLimpezaExterna = dataHojeIso;
      proxExternaEnvio   = novaProxExternaIso;
    }

    var payload = {
      equipamento_id:           equip.id,
      local:                    equip.local,
      tipo_limpeza:             tipo,
      data_limpeza_interna:     dataLimpezaInterna,
      proxima_limpeza_interna:  proxInternaEnvio,
      data_limpeza_externa:     dataLimpezaExterna,
      proxima_limpeza_externa:  proxExternaEnvio,
      descricao:   (document.getElementById('descricao_limpeza') || {}).value || '—',
      pecas:       (document.getElementById('pecas')             || {}).value || '—',
      observacoes: (document.getElementById('observacoes')       || {}).value || '—',
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    })
    .then(function(r) { return r.json(); })
    .then(function(resp) {
      if (resp.status === 'ok') {
        mostrarSucesso(payload);
      } else {
        throw new Error(resp.msg || 'Erro desconhecido');
      }
    })
    .catch(function(err) {
      console.error(err);
      msgErro.textContent = '⚠️ Erro ao enviar. Verifique sua conexão e tente novamente.';
      msgErro.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = '✅ Registrar Manutenção';
    });
  };

  function mostrarSucesso(p) {
    document.getElementById('tela-form').style.display = 'none';
    document.getElementById('tela-sucesso').style.display = 'block';
    var titulo, detalhe;
    detalhe = '<strong>' + equip.id + ' · ' + equip.local + '</strong><br><br>';
    if (p.tipo_limpeza === 'Limpeza Interna') {
      titulo = 'Limpeza Interna registrada!';
      detalhe += '🔧 Realizada em ' + isoParaBr(dataHojeIso) + '<br>📅 Próxima: <strong>' + isoParaBr(p.proxima_limpeza_interna) + '</strong>';
    } else if (p.tipo_limpeza === 'Limpeza Externa e Checagem do Gás') {
      titulo = 'Limpeza Externa e Checagem do Gás registrada!';
      detalhe += '🧹 Realizada em ' + isoParaBr(dataHojeIso) + '<br>🧹 Próxima: <strong>' + isoParaBr(p.proxima_limpeza_externa) + '</strong>';
    } else {
      titulo = 'Manutenção registrada!';
      detalhe += '🛠️ ' + p.descricao;
    }
    document.getElementById('sucesso-titulo').textContent = titulo;
    document.getElementById('sucesso-detalhe').innerHTML  = detalhe;
  }
}
</script>
</body>
</html>
